# ════════════════════════════════════════════════════════════════════════
#  PostgreSQL Database - Persistent storage for application data
# ════════════════════════════════════════════════════════════════════════

# PersistentVolumeClaim - Requests storage for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: planify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi  # 5GB storage for database
  storageClassName: managed-csi

---
# Deployment - PostgreSQL StatefulSet-like deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: planify
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1  # Single instance (for simplicity)
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate  # Ensures no two postgres pods run simultaneously
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planify-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - planify
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - planify
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# Service - Internal network access to PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: planify
  labels:
    app: postgres
    tier: database
spec:
  type: ClusterIP  # Internal only
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
