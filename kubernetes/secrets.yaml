# ════════════════════════════════════════════════════════════════════════
#  Secrets - Sensitive configuration (passwords, connection strings)
#  ⚠️  IMPORTANT: Replace base64 values before deploying to production!
# ════════════════════════════════════════════════════════════════════════
# ConfigMap - Non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: planify-config
  namespace: planify
data:
  POSTGRES_USER: "planify"
  POSTGRES_DB: "planify"
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
