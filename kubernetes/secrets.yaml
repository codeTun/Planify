# ════════════════════════════════════════════════════════════════════════
#  Secrets - Sensitive configuration (passwords, connection strings)
#  ⚠️  IMPORTANT: Replace base64 values before deploying to production!
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: planify-secrets
  namespace: planify
type: Opaque
data:
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}

---
# ConfigMap - Non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: planify-config
  namespace: planify
data:
  POSTGRES_USER: "planify"
  POSTGRES_DB: "planify"
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
