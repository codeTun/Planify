# ════════════════════════════════════════════════════════════════════════
#  Ingress - Exposes the app to the internet (Azure Load Balancer)
#  For Azure AKS, this will automatically provision an Azure Load Balancer
# ════════════════════════════════════════════════════════════════════════

# Option 1: LoadBalancer Service (Simple - recommended for Azure)
apiVersion: v1
kind: Service
metadata:
  name: planify-loadbalancer
  namespace: planify
  labels:
    app: planify-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 3000
    protocol: TCP
    name: https
  selector:
    app: planify-app

---
