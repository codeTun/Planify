# ════════════════════════════════════════════════════════════════════════
#  Planify Application - Next.js app with replicas for high availability
# ════════════════════════════════════════════════════════════════════════

# Deployment - Application with multiple replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planify-app
  namespace: planify
  labels:
    app: planify-app
    tier: frontend
spec:
  replicas: 3  # 3 instances for load balancing and redundancy
  selector:
    matchLabels:
      app: planify-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Max 1 extra pod during updates
      maxUnavailable: 1  # Max 1 pod can be unavailable during updates
  template:
    metadata:
      labels:
        app: planify-app
        tier: frontend
    spec:
      # Init container to wait for database migrations
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z postgres 5432; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is up!"
      
      containers:
      - name: planify-app
        image: planify-app:latest  # Replace with your Docker Hub image: yourusername/planify:latest
        imagePullPolicy: IfNotPresent  # Change to Always for production with registry
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: PORT
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: NEXT_TELEMETRY_DISABLED
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?schema=public"
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planify-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: planify-config
              key: POSTGRES_DB
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: planify-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

---
# Service - Internal load balancer for app pods
apiVersion: v1
kind: Service
metadata:
  name: planify-app
  namespace: planify
  labels:
    app: planify-app
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: planify-app
